<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-bleed 3D diorama with a floating toy-like HUD; panels are paper cards with chunky "pressable" buttons. */
:root {
  --sky: #c7dbfa;
  --paper: #fffaf0;
  --paper-2: #f8ead6;
  --ink: #553a2e;
  --ink-soft: #8a6a5a;
  --orange: #ffa154;
  --green: #74cc7a;
  --pink: #ff8fae;
  --blue: #73b3f5;
  --purple: #b294f2;
  --gold: #ffc733;
  --gray: #c9bfb6;
  --shadow: rgba(102, 64, 51, .28);
  --display: "Mali", "Kanit", system-ui, sans-serif;
  --body: "Kanit", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#ui { position: fixed; inset: 0; pointer-events: none; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
#ui > * { pointer-events: auto; }

button { font-family: var(--body); color: #fff; border: 0; cursor: pointer; border-radius: 16px; padding: 8px 14px; font-size: 16px;
  background: var(--c, var(--orange)); box-shadow: 0 4px 0 var(--shadow); text-shadow: 0 1px 0 rgba(85,58,46,.45);
  transition: transform .08s, box-shadow .08s, filter .15s; line-height: 1.15; }
button:hover { filter: brightness(1.05); }
button:active { transform: translateY(3px) scale(.97); box-shadow: 0 1px 0 var(--shadow); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button:disabled { --c: var(--gray); cursor: default; filter: none; }
button.ghost { --c: var(--paper-2); color: var(--ink); text-shadow: none; }

.pill { display: flex; align-items: center; gap: 6px; background: var(--paper); border-radius: 999px; padding: 4px 14px 4px 6px;
  box-shadow: 0 4px 0 var(--shadow); font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill svg { width: 28px; height: 28px; flex: none; }
#hud { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px; display: flex; gap: 8px; flex-wrap: wrap; max-width: calc(100% - 130px); }
#settingsBtn { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; --c: var(--purple); }

#bottom { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; gap: 12px; }
.big { width: 112px; height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 4px 6px 8px; font-size: 17px; border-radius: 22px; }
.big img { width: 62px; height: 62px; object-fit: contain; pointer-events: none; }
#strayBtn { position: absolute; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); --c: var(--pink); font-size: 17px; animation: wiggle 1.2s ease-in-out infinite; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg) scale(1.04); } 75% { transform: rotate(3deg) scale(1.04); } }

.toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%); background: rgba(85,58,46,.93);
  color: #fff; border-radius: 16px; padding: 10px 18px; font-size: 16px; max-width: min(560px, calc(100% - 40px)); text-align: center; pointer-events: none;
  animation: pop .25s ease-out; }
@keyframes pop { from { transform: translateX(-50%) scale(.85); opacity: 0; } }

.modalBg { position: absolute; inset: 0; background: rgba(64, 38, 30, .45); display: flex; align-items: center; justify-content: center; padding: 14px; }
.card { background: var(--paper); border-radius: 26px; box-shadow: 0 6px 0 var(--shadow); padding: 16px 18px; position: relative; animation: cardIn .22s ease-out;
  max-height: calc(100% - 20px); display: flex; flex-direction: column; min-width: 0; }
@keyframes cardIn { from { transform: scale(.88); opacity: .3; } }
.card h2 { font-family: var(--display); font-size: 26px; margin: 0 52px 10px 4px; text-wrap: balance; }
.close { position: absolute; top: 12px; right: 12px; --c: var(--pink); width: 42px; height: 42px; padding: 0; font-size: 18px; }

.shop { width: min(980px, 100%); height: min(640px, 100%); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tabs button { --c: #d8c4b2; font-size: 15px; padding: 7px 12px; }
.tabs button.on { --c: var(--orange); }
.coinBox { position: absolute; right: 66px; top: 16px; }
.grid { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 4px 4px 10px; flex: 1; min-height: 0; }
.item { background: #fff; border-radius: 18px; box-shadow: 0 3px 0 var(--shadow); padding: 8px; display: flex; flex-direction: column; gap: 4px; position: relative; }
.item .ic { background: #fff3e2; border-radius: 14px; height: 108px; display: flex; align-items: center; justify-content: center; }
.item .ic img { width: 100px; height: 100px; object-fit: contain; }
.item b { font-weight: 500; font-size: 16px; line-height: 1.2; }
.item small { color: var(--ink-soft); font-size: 13px; line-height: 1.25; min-height: 34px; }
.item button { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 16px; }
.badge { position: absolute; top: 6px; right: 6px; background: var(--orange); color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 13px; }
.coin { width: 20px; height: 20px; flex: none; }

#catPanel, #itemPanel { position: absolute; right: 12px; top: 50%; transform: translateY(-46%); width: 330px; padding: 14px 16px; gap: 6px; }
#catPanel .head, #itemPanel .head { display: flex; gap: 10px; align-items: center; }
#catPanel .head img, #itemPanel .head img { width: 74px; height: 74px; background: #ffeedd; border-radius: 50%; object-fit: contain; }
#catPanel .name, #itemPanel .name { font-family: var(--display); font-size: 24px; line-height: 1.1; }
#catPanel .breed, #catPanel .status, #catPanel .extra, #itemPanel .status { color: var(--ink-soft); font-size: 14px; }
.stat { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 8px; font-size: 14px; }
.bar { height: 16px; background: #eedfd0; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--c); transition: width .3s; }
.stats { display: grid; gap: 5px; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
.actions button { padding: 10px 4px; }
#adoptBtn { --c: var(--green); font-size: 20px; padding: 10px; animation: wiggle 1.4s ease-in-out infinite; }
#renameBtn { --c: var(--purple); font-size: 14px; }

#decor { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); max-width: 1000px; margin: 0 auto; padding: 10px 14px; gap: 8px; }
#decor .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#decor .top h2 { margin: 0; font-size: 22px; }
#decor .hint { color: var(--ink-soft); font-size: 14px; flex: 1; min-width: 160px; }
#decor .bag { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; }
.bagItem { --c: #fff; color: var(--ink); text-shadow: none; width: 104px; flex: none; display: flex; flex-direction: column; align-items: center; padding: 4px; position: relative; font-size: 13px; }
.bagItem img { width: 76px; height: 76px; object-fit: contain; }
#decor .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 6px 0; }
#decor .acts button { min-width: 110px; padding: 12px; font-size: 17px; }

.food { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; background: #fff; border-radius: 16px; padding: 6px 10px; box-shadow: 0 3px 0 var(--shadow); }
.food img { width: 70px; height: 70px; object-fit: contain; }
.food small { color: var(--ink-soft); display: block; font-size: 13px; }
.list { display: grid; gap: 8px; overflow-y: auto; min-height: 0; padding: 2px 2px 8px; }
.popup { width: min(460px, 100%); text-align: center; align-items: center; gap: 8px; }
.popup p { white-space: pre-line; margin: 4px 0 8px; line-height: 1.45; color: var(--ink-soft); }
.popup img { width: 120px; height: 120px; object-fit: contain; }
.popup .row { display: flex; gap: 10px; justify-content: center; }
.popup .row button { min-width: 120px; padding: 11px; font-size: 18px; }
.catCard { --c: #fff; color: var(--ink); text-shadow: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px; }
.catCard img { width: 96px; height: 96px; object-fit: contain; }

/* floating world labels */
.bubble { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; display: flex; align-items: center; gap: 4px; background: #fff7dc;
  color: var(--ink); text-shadow: none; padding: 3px 10px 3px 4px; font-size: 17px; border-radius: 99px; animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { margin-top: -5px; } }
.thought { position: absolute; transform: translate(-10%, -100%); width: 44px; height: 44px; background: #fff; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; box-shadow: 0 3px 0 var(--shadow); font-family: var(--display); color: var(--blue); }
.thought img { width: 38px; height: 38px; object-fit: contain; }
.trust { position: absolute; transform: translate(-50%, -100%); width: 92px; display: flex; gap: 4px; align-items: center; background: rgba(255,255,255,.92);
  border-radius: 99px; padding: 3px 8px 3px 4px; box-shadow: 0 3px 0 var(--shadow); }
.trust .bar { flex: 1; height: 10px; }
.tag { position: absolute; transform: translate(-50%, -100%); font-family: var(--display); font-size: 17px; color: #fff; white-space: nowrap;
  text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
.heart, .floatText { position: absolute; transform: translate(-50%, -50%); }
.floatText { font-family: var(--display); font-size: 22px; color: var(--gold); text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink); white-space: nowrap; }

.health { background: #fff0f0; border-radius: 12px; padding: 6px 10px; font-size: 14px; color: #a3394f; white-space: pre-line; }
.health.ok { background: #effaef; color: #3f7d45; }
#treatBtn { --c: #ff6b81; }
.marker { position: absolute; transform: translate(-50%, -100%); width: 34px; height: 34px; border-radius: 50%; background: #fff; box-shadow: 0 3px 0 var(--shadow);
  display: flex; align-items: center; justify-content: center; pointer-events: none; }
.marker svg { width: 24px; height: 24px; }
.marker.broken { background: #ffe0e0; animation: bob 1s ease-in-out infinite; }
#fade { position: fixed; inset: 0; background: var(--sky); opacity: 0; pointer-events: none; transition: opacity .25s; }
#fade.on { opacity: 1; }
#viewBtn { position: absolute; left: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); --c: #8fbf5a; }
.open { color: #3f7d45; } .closed { color: #a3394f; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 22px; background: var(--sky); }

@media (max-width: 720px), (orientation: portrait) {
  #catPanel, #itemPanel { left: 8px; right: 8px; width: auto; top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); transform: none; }
  .stats { grid-template-columns: 1fr 1fr; column-gap: 12px; }
  .stat { grid-template-columns: 64px 1fr; font-size: 13px; }
  #hud { gap: 6px; }
  .pill { font-size: 15px; padding: 3px 10px 3px 4px; }
  .pill svg { width: 22px; height: 22px; }
  .toast { top: calc(env(safe-area-inset-top, 0px) + 104px); }
  #bottom { gap: 6px; }
  .big { width: 84px; height: 84px; font-size: 13px; border-radius: 18px; padding: 4px 4px 7px; }
  .big img, .big svg { width: 46px !important; height: 46px !important; }
  #viewBtn { bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); }
  #strayBtn { right: 50%; transform: translateX(50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); animation: none; }
  .card h2 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

function makeGhost() {

}

function beginPlace(def) { cancelGhost(); pl.def = def; pl.rot = 0; pl.offset.set(0, 0, 0); makeGhost(); pl.cell = freeCell(def, 0); updateGhost(); refreshDecor(); }
function beginMove(it) {
  cancelGhost(); pl.moving = it; pl.def = it.def; pl.rot = it.rot; pl.cell = [it.x, it.z]; pl.offset.set(0, 0, 0);
  releaseItemUsers(it); it.obj.visible = false; makeGhost(); updateGhost(); sfx.pop(); refreshDecor();
}
function rotateGhost() { if (!pl.ghost) return; const c = footCenter(pl.def, pl.cell[0], pl.cell[1], pl.rot); pl.rot = (pl.rot + 1) % 4; pl.cell = cellFor(pl.def, pl.rot, c); updateGhost(); }
function storeMoving() {
  if (!pl.moving) return; const it = pl.moving; it.obj.visible = true; removeItem(it); pl.moving = null;
  if (!it.broken) addItem(it.def.id); destroyGhost(); sfx.pop(); refreshDecor(); refreshHud();
}
function cancelGhost() { if (pl.moving) { pl.moving.obj.visible = true; pl.moving = null; } destroyGhost(); refreshDecor(); }
function commit() {

  else { if (!takeItem(pl.def.id)) { cancelGhost(); return false; } placeItem(pl.def, pl.cell[0], pl.cell[1], pl.rot); }

}

// ---------------- Input ----------------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let press = null; const pointers = new Map(); let pinchD = 0;
function setRay(e) { const r = renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); }
function floorPoint(e) { setRay(e); const p = new THREE.Vector3(); return ray.ray.intersectPlane(floorPlane, p) ? p : null; }
function firstTagged(objs, key) { for (const hit of ray.intersectObjects(objs, true)) { let o = hit.object; while (o && !o.userData[key]) o = o.parent; if (o) return { o, hit }; } return null; }
function pickItem(e) { setRay(e); let best = null, bd = 1e9; for (const hit of ray.intersectObjects(room.items.map(i => i.obj), true)) { let o = hit.object; while (o && !o.userData.item) o = o.parent; if (!o) continue; const it = o.userData.item, d = hit.distance + (it.def.flat ? 50 : 0); if (d < bd) { bd = d; best = it; } } return best; }
function pickCat(e) { setRay(e); const all = view === "cafe" ? cats : (stray ? [stray] : []); const r = firstTagged(all.map(c => c.root), "cat"); return r ? r.o.userData.cat : null; }
function pickDoor(e) { setRay(e); return !!firstTagged([view === "cafe" ? room.door : yard.door], "door"); }
function followGhost(e) { const p = floorPoint(e); if (!p || p.x < -1 || p.z < -1 || p.x > ROOM + 1 || p.z > ROOM + 1) return; const c = cellFor(pl.def, pl.rot, p.add(pl.offset)); if (c[0] !== pl.cell[0] || c[1] !== pl.cell[1]) { pl.cell = c; updateGhost(); } }
const cv = renderer.domElement;
cv.addEventListener("pointerdown", e => {
  sfx.unlock(); pointers.set(e.pointerId, e); try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchD = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); press = null; return; }

});
cv.addEventListener("pointermove", e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, e);

function endPointer(e) {

  const moved = Math.hypot(e.clientX - press.x, e.clientY - press.y), slop = Math.max(10, Math.min(innerWidth, innerHeight) * .03); press = null;
  if (editMode) { if (!pl.ghost) return; if (pl.moving && moved < slop && pl.cell[0] === pl.moving.x && pl.cell[1] === pl.moving.z && pl.rot === pl.moving.rot) return; if (!commit()) sfx.error(); return; }
  if (moved >= slop) return;

  select(null); selectItem(null);
}
cv.addEventListener("pointerup", endPointer); cv.addEventListener("pointercancel", e => { pointers.delete(e.pointerId); press = null; });
cv.addEventListener("wheel", e => { e.preventDefault(); zoom = clamp(zoom + Math.sign(e.deltaY) * .08, .65, 1.15); resize(); }, { passive: false });
addEventListener("keydown", e => { if (!editMode) return; if (e.key === "r" || e.key === "R") rotateGhost(); if (e.key === "Escape") cancelGhost(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });
addEventListener("pagehide", saveNow);

// ---------------- Floating labels (payments, thoughts, hearts, item markers) ----------------
const bubbles = new Map(), tags = new Map(), markers = new Map(), effects = [];
function toScreen(p) { const v = p.clone().project(camera), r = renderer.domElement.getBoundingClientRect(); return { x: (v.x + 1) / 2 * r.width + r.left, y: (1 - v.y) / 2 * r.height + r.top }; }
function addCoinBubble(owner, n) {
  let b = bubbles.get(owner); if (b) { b.amount += n; b.el.querySelector("span").textContent = "+" + b.amount; return; }
  b = { owner, amount: n, age: 0, el: h(`<button class="bubble">${COIN_SVG}<span>+${n}</span></button>`) };
  b.el.addEventListener("pointerdown", e => e.stopPropagation());
  b.el.addEventListener("click", e => { e.stopPropagation(); sfx.unlock(); collect(b, true); });
  fx.appendChild(b.el); bubbles.set(owner, b); if (view === "cafe") sfx.pop();
}

  if (!bubbles.has(b.owner)) return; const total = tapped ? Math.round(b.amount * 1.5) : b.amount; addCoins(total);

function spawnHearts(world, n) {

    effects.push({ el, x: s.x + rand(-26, 26), y: s.y + rand(-16, 4), vx: rand(-30, 30), vy: -rand(80, 140), life: 0, max: rand(1, 1.6) }); }
}

  const s = toScreen(world);
  for (let i = 0; i < 4; i++) { const el = h(`<div class="heart" style="width:${rand(8, 14)}px;height:${rand(8, 14)}px;border-radius:50%;background:#e8f5d0;border:2px solid #b5cf8a"></div>`); fx.appendChild(el);
    effects.push({ el, x: s.x + rand(-8, 8), y: s.y + 10, vx: rand(-60, 60), vy: rand(-40, 10), life: 0, max: rand(.6, .9) }); }
}
function floatText(x, y, text) { const el = h(`<div class="floatText">${esc(text)}</div>`); fx.appendChild(el); effects.push({ el, x, y, vx: 0, vy: -100, life: 0, max: 1.2 }); }
function getTag(c) {
  let t = tags.get(c); if (t) return t;
  t = { th: h(`<div class="thought"></div>`), trust: h(`<div class="trust">${HEART_SVG.replace("<svg", '<svg style="width:20px;height:20px"')}<div class="bar" style="--c:#ff7399"><i></i></div></div>`), name: h(`<div class="tag"></div>`), last: null };

const THOUGHT_HTML = {
  sleepy: () => "Zz", love: () => HEART_SVG.replace("<svg", '<svg style="width:30px;height:30px"'), sick: () => CROSS_SVG.replace("<svg", '<svg style="width:28px;height:28px"'),
  angry: () => '<b style="color:#e0465f;font-size:26px">!</b>', hungry: () => `<img alt="" src="${icons.item(ITEM.food_bowl)}">`, bored: () => `<img alt="" src="${icons.item(ITEM.toy_ball)}">`,

function updateFloating(dt) {

  for (const c of all) {
    const t = getTag(c), vis = visibleCats.includes(c) && !editMode, s = vis ? toScreen(c.headTop()) : null, th = c.thought, showT = vis && th;

  }

// ---------------- Boot & loop ----------------
function clearWorld() {
  for (const c of cats) scene.remove(c.root); cats.length = 0; if (stray) scene.remove(stray.root); stray = null;
  for (const w of walkers) scene.remove(w.root); walkers.length = 0;

  for (const b of bubbles.values()) b.el.remove(); bubbles.clear(); for (const t of tags.values()) { t.th.remove(); t.trust.remove(); t.name.remove(); } tags.clear();
  for (const m of markers.values()) m.remove(); markers.clear();

}
function boot() {

  applyWall(ITEM[S.wallpaper] || ITEM.wall_cream); applyFloor(ITEM[S.flooring] || ITEM.floor_wood);

      if (earned > 0) { addCoins(earned); popup(T("welcome_back"), F("welcome_body", earned.toLocaleString(), fmtDur(el)), icons.item(ITEM.cafe_table), [[T("yay"), "var(--green)", null]]); }
    }

}
buildShell();
buildYard();
boot();
document.getElementById("loading").remove();

let last = performance.now(), hudT = 0;
function frame(nowMs) {
  const dt = Math.min(.1, (nowMs - last) / 1000); last = nowMs; const now = nowMs / 1000;

  room.doorTimer -= dt; room.doorAngle += clamp((room.doorTimer > 0 ? -80 : 0) - room.doorAngle, -220 * dt, 220 * dt); room.door.rotation.y = room.doorAngle * D2R;

  scene.traverse(o => { if (o.userData.spin) o.rotation.y += o.userData.spin * dt; if (o.userData.spinZ) o.rotation.z += o.userData.spinZ * dt; });
  selRing.rotation.y += dt * .7;
  updateFloating(dt); updateCatPanel(); updateItemPanel();
  hudT -= dt; if (hudT <= 0) { hudT = .25; refreshHud(); if (shop) shop.card.querySelector(".sc").textContent = S.coins.toLocaleString(); }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) nextToast(); }

}
requestAnimationFrame(frame);
window.__cozy = { get S() { return S; }, cats: () => cats, customers: () => customers, items: () => room.items, spawnStray, spawnCustomer, select, selectItem, get stray() { return stray; },
  showShop, enterEdit, goOutside, goInside, infect, wearItem, adopt };
